<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }}｜{{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

<header class="site-head">
  <a class="site-name" href="{{ '/' | relative_url }}">MuJoCo 繁體中文教學</a>
  <nav class="site-nav">
    <a href="{{ '/docs/' | relative_url }}">教學章節</a>
    <a href="{{ '/runs/' | relative_url }}">實驗紀錄</a>
    <a href="{{ '/REPORT.html' | relative_url }}">成果報告</a>
    <a href="{{ '/docs/glossary.html' | relative_url }}">術語表</a>
    <a class="ext" href="{{ site.repo }}">GitHub</a>
  </nav>
</header>

<main class="page">
  {{ content }}
</main>

<footer class="site-foot">
  <p>
    本專案採 source-available 授權（教學專案適配版，基於 RRSAL-1.0）：非商業用途免費，
    實況與影片明示允許，商業使用另行洽談。全文見 <a href="{{ '/LICENSE' | relative_url }}">LICENSE</a>。
  </p>
  <p class="muted">
    Copyright © 2026 Wang Chun-Yu (wicanr2)．MuJoCo 引擎與其官方文件屬 Google DeepMind，依 Apache License 2.0 提供．
    本站與 Google DeepMind 沒有隸屬或授權關係。
  </p>
</footer>

<script>
// 寬表（欄數 ≥ 5 或實際溢出）才包進可捲動容器，四欄的表不必撐開
document.querySelectorAll('.page table').forEach(function (t) {
  var cols = t.querySelector('tr') ? t.querySelector('tr').children.length : 0;
  if (cols >= 5 || t.scrollWidth > t.parentNode.clientWidth) {
    var w = document.createElement('div');
    w.className = 'table-scroll';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  }
});
</script>
</body>
</html>
