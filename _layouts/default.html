<script type="module">
// mermaid 圖：只有頁面真的有 ```mermaid 區塊時才去拉 CDN。
// 配色沿用全站的語意變數（關鍵路徑色只有鏽橙一個，線條細、不用色塊）。
const blocks = document.querySelectorAll('pre > code.language-mermaid');
if (blocks.length) {
  const css = getComputedStyle(document.documentElement);
  const v = (n) => css.getPropertyValue(n).trim();
  const { default: mermaid } = await import(
    'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    securityLevel: 'strict',
    flowchart: { curve: 'basis', padding: 14, useMaxWidth: true },
    themeVariables: {
      fontFamily: v('--sans'),
      fontSize: '15px',
      background: v('--paper'),
      primaryColor: v('--panel'),
      primaryTextColor: v('--ink'),
      primaryBorderColor: v('--rule-2'),
      secondaryColor: v('--key-soft'),
      secondaryBorderColor: v('--key'),
      tertiaryColor: v('--paper'),
      tertiaryBorderColor: v('--rule'),
      lineColor: v('--ink-3'),
      textColor: v('--ink'),
      nodeBorder: v('--rule-2'),
      clusterBkg: 'transparent',
      clusterBorder: v('--rule'),
      edgeLabelBackground: v('--paper'),
    },
  });
  blocks.forEach((code) => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent;
    div.dataset.src = code.textContent;   // 留著原文，切換深色模式時要重畫
    code.parentElement.replaceWith(div);
  });
  await mermaid.run({ querySelector: '.mermaid' });

  // 配色是在初始化時從 CSS 變數讀進去的，之後切換系統主題不會自己更新。
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', async () => {
    const css2 = getComputedStyle(document.documentElement);
    const v2 = (n) => css2.getPropertyValue(n).trim();
    mermaid.initialize({
      startOnLoad: false, theme: 'base', securityLevel: 'strict',
      flowchart: { curve: 'basis', padding: 14, useMaxWidth: true },
      themeVariables: {
        fontFamily: v2('--sans'), fontSize: '15px',
        background: v2('--paper'), primaryColor: v2('--panel'),
        primaryTextColor: v2('--ink'), primaryBorderColor: v2('--rule-2'),
        secondaryColor: v2('--key-soft'), secondaryBorderColor: v2('--key'),
        tertiaryColor: v2('--paper'), tertiaryBorderColor: v2('--rule'),
        lineColor: v2('--ink-3'), textColor: v2('--ink'), nodeBorder: v2('--rule-2'),
        clusterBkg: 'transparent', clusterBorder: v2('--rule'),
        edgeLabelBackground: v2('--paper'),
      },
    });
    document.querySelectorAll('.mermaid').forEach((d) => {
      d.removeAttribute('data-processed');
      d.textContent = d.dataset.src;
    });
    await mermaid.run({ querySelector: '.mermaid' });
  });
}
</script>

<script>
// 寬表（欄數 ≥ 5 或實際溢出）才包進可捲動容器，四欄的表不必撐開
document.querySelectorAll('.page table').forEach(function (t) {
  var cols = t.querySelector('tr') ? t.querySelector('tr').children.length : 0;
  if (cols >= 5 || t.scrollWidth > t.parentNode.clientWidth) {
    var w = document.createElement('div');
    w.className = 'table-scroll';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  }
});
</script>
</body>
</html>
